[[session]]

name = "Foreman"
path = "~/Projects/foreman"
startup_command = "nvim"
preview_command = "eza --all --git --icons --color=always {}"
windows = [ "fish", "curl", "lgit" ]

[[window]]
name = "curl"
startup_script = """
tmux select-window -t 3
tmux split-window -h
tmux split-window -v
tmux select-pane -t 1 && clear
tmux resize-pane -x 100 && clear
tmux select-window -t 1 && clear"""

[[window]]
name = "lgit"
startup_script = "lazygit"

[[window]]
name = "zsh"
startup_script = "clear"

[[window]]
name = "fish"
startup_script = "clear"
