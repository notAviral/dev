# vim: ft=tmux
# ------------------------------------------------------------------
# Appearance
# ------------------------------------------------------------------
source-file ~/.config/tmux/assets/colors.conf

set -g status-position top
set -g status-interval 5
set -g status-style "fg=#{@fg_muted},bg=#{@bg_secondary}"

# Left: session name — fixed width to anchor centering
set -g status-left-length 20
set -g status-left " #[fg=#{@fg_orange},bold]#S#[fg=#{@fg_muted}] │ "

# Right: host (small), date (smaller), time (accent)
set -g status-right-length 80
set -g status-right "#[fg=#{@fg_muted}]│#[fg=#{@fg_muted},dim]#h #[fg=#{@fg_muted},dim]%a %d %b #[fg=#{@fg_cyan},bold]%H:%M"

# Center window list
set -g status-justify absolute-centre

# Window tabs — dot separator, pill highlight for active
set -g window-status-separator "#[fg=#{@fg_muted}] · "
set -g window-status-format "#[fg=#{@fg_muted}]#I:#W"
set -g window-status-current-format "#[fg=#{@fg_blue},bold]#I:#W #[fg=#{@fg_blue},nobold]▲"

# Messages and mode
set -g message-style "fg=#{@fg_primary},bg=#{@bg_secondary}"
set -g mode-style "fg=#{@bg_secondary},bg=#{@fg_cyan}"

# Pane borders
set -g pane-border-style "fg=#{@fg_orange}"
