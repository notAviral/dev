
'$schema' = 'https://starship.rs/config-schema.json'

scan_timeout = 100
command_timeout = 500
follow_symlinks = false
add_newline = true

palette = 'test'

format = """
$directory\
$line_break\
$git_branch\
$git_status\
$nix_shell
$character"""

[fill]
symbol = ' '

[nix_shell]
symbol = ""
style = "bold blue"
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = "unknown"
format = '[via ](bold white)[$symbol nixShell:\($state\)]($style)'

[directory]
style = 'bold cyan'
format = '[$path]($style)'
truncate_to_repo = false
truncation_length = 2

[directory.substitutions]
'Documents' = '󰈙 '
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '
'Developer' = '󰲋 '
'Others' = ' '
'~' = 'HOME'

[username]
disabled = true
show_always = true
style_user = 'green'
style_root = 'red'
format = '[$user]($style)[@](bold white)'

[hostname]
disabled = true
style = 'bold magenta'
ssh_only = false
ssh_symbol = '󱚿 '
format = '[$ssh_symbol$hostname]($style) [ in ](bold white) '

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[λ](bold fg:yellow)'

[git_branch]
symbol = ' '
style = 'bold magenta'
format = '[ @ git:\(](bold white)[$branch$symbol]($style)[\)](bold white)'

[git_status]
format = '[ $untracked$staged$modified$renamed$conflicted$ahead_behind ]($style)'
# options available for format
staged     = '[+](green)'
modified   = '[!](yellow)'
renamed    = '[»](blue)'
deleted    = '[-](red)'
untracked  = '[?](red)'
stashed    = '[≡](magenta)'
conflicted = '[✖](red bold)'
ahead      = '[⇡${count}](green)'
behind     = '[⇣${count}](cyan)'
diverged   = '[⇕⇡${ahead_count}⇣${behind_count}](red)'

[nodejs]
symbol = ''
format = '[ $symbol( $version) ]($style)'

[bun]
detect_files = ['bun.lock', 'bun.lockb']

[c]
symbol = ' '
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ' '
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ''
format = '[ $symbol( $version) ]($style)'
detect_files = ['go.mod']

[php]
symbol = ' '
format = '[ $symbol( $version) ]($style)'

[java]
symbol = ' '
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = ''
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = ''
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ''
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ''
format = '[ $symbol( $context) ]($style)'

[palettes.test]
background = "#16161e"
foreground = "#c0caf5"

surface0 = "#292e42"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7" 
cyan = "#7dcfff"
white = "#c0caf5"
